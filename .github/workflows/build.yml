name: build

on:
  push:
  pull_request:

jobs:
  verify:
    name: build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn -B verify

  jdl-parser:
    name: JHipster JDL parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the JHipster JDL parser
        run: npm install generator-jhipster --no-save --no-package-lock
      - name: Import the generated JDL with JHipster
        run: mvn -B test -Djdl.parser.dir=$PWD/node_modules
